  pnpm test              # "vitest" — runs Vitest in WATCH mode (unit + integration)
  pnpm test:e2e          # Run Playwright E2E tests (data prefixed `from Playwright-E2E`)

  # Recommended scripts to add:
  pnpm test:run          # CI run, no watch ("vitest run")
  pnpm test:ui           # Vitest UI in browser ("vitest --ui")
  pnpm test:cov          # Coverage report + 90% threshold check ("vitest run --coverage")
