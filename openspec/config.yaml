  ## Architecture Patterns

  ### Clean Architecture Overview

  ```
  ┌─────────────────────────────────────────────────────────────┐
  │                    Routes / Controllers                      │
  │       (Astro pages + island handlers / Hono API routes)      │
  └──────────────────────────┬──────────────────────────────────┘
                             │ calls
  ┌──────────────────────────▼──────────────────────────────────┐
  │                   Engine / Facade Layer                      │
  │         (Business logic, orchestrates 2+ services)           │
  │                                                              │
  │   • Coordinates multiple services                            │
  │   • Contains business rules and validation                   │
  │   • Transaction boundaries                                   │
  │   • ONLY create when orchestrating 2+ services               │
  │   • Can be shared between frontend and backend if portable   │
  └──────────────────────────┬──────────────────────────────────┘
                             │ delegates
  ┌──────────────────────────▼──────────────────────────────────┐
  │                      Service Layer                           │
  │           (Direct integration with external systems)         │
  │                                                              │
  │   Backend: D1Service │ HyperdriveService │ KVService │       │
  │            R2Service │ DOService │ VectorizeService │         │
  │            AIService │ LoggerService │ AuthService            │
  │                                                              │
  │   Frontend: ApiService │ OAuthService │ PaymentService │     │
  │             MapService │ SmartContractService                │
  │                                                              │
  └─────────────────────────────────────────────────────────────┘
  ```

  ### Layer Discipline Rules

  **Routes/Controllers:**

  - Astro: `.astro` pages render server-first; interactive islands (React/Vue/Solid)
    call into frontend engines/services from event handlers — keep islands thin
  - Hono: API route handlers under `src/server/routes/v1/`
  - Thin layer — delegates to engines or services, no business logic

  **Engine/Facade Layer:**

  - Contains business logic and orchestration
  - Coordinates 2+ services with shared business rules
  - Handles transaction boundaries and cross-cutting concerns
  - **ONLY create when needed** — do not create unnecessary engine layers
  - Can be shared between frontend and backend if logic is portable (place portable engines in `shared/`)

  **Service Layer:**

  - Direct integration with external services — no business logic
  - Pure data access and manipulation
  - Backend services: D1, Hyperdrive, KV, R2, Durable Objects, Vectorize, Workers AI, Logger
  - Frontend services: API client (`/api/v1`), OAuth, Payment Gateways, Maps, Smart Contracts, third-party libraries

  **Creation Rules:**

  ```
  ✅ Create Engine: When orchestrating 2+ services with business logic
  ✅ Create Service: For each external integration point
  ❌ Don't Create: Unnecessary abstraction layers
  ❌ Don't Create: Engine that just proxies a single service
  ❌ Don't Create: Extra layers beyond engine + service
  ```

  ### Dependency Injection (Awilix)

  Follow the [official Awilix guide](https://github.com/jeffijoe/awilix/blob/master/README.md) for implementation.

  **Key Principles:**

  - **Interface-based contracts** — All services/engines are registered against interfaces (`shared/types/`), never concrete classes
  - **`PROXY` injection mode** — Use `InjectionMode.PROXY` so dependencies are resolved by name from a typed `cradle`
  - **Container registration** — Use `asClass`/`asFunction` with an explicit lifetime (`scoped` for per-request, `singleton` for stateless)
  - **Scoped containers** — Build a request-scoped container per API request and register the request `Env`/correlation id into it
  - **Testability** — Swap real bindings for mocks via `container.register(...)` overrides in tests
  - **Separate containers** — `src/containers/` for frontend, `src/server/containers/` for backend

  ```typescript
  // shared/types/user.types.ts — interface contract (the DI binding key's type)
  export interface UserService {
    findById(id: string): Promise<User | null>;
  }

  // src/server/services/user.service.ts
  import type { D1Service } from "../../../shared/types/d1.types";
  import type { UserService } from "../../../shared/types/user.types";

  export class UserServiceImpl implements UserService {
    constructor(private readonly deps: { d1Service: D1Service }) {}

    async findById(id: string): Promise<User | null> {
      return this.deps.d1Service.queryUser(id);
    }
  }

  // src/server/containers/index.ts — interface-typed cradle, PROXY mode
  import { asClass, createContainer, InjectionMode } from "awilix";
  import type { UserService } from "../../../shared/types/user.types";

  export interface Cradle {
    userService: UserService;
  }

  export function createRequestContainer(env: Env) {
    const container = createContainer<Cradle>({ injectionMode: InjectionMode.PROXY });
    container.register({
      userService: asClass(UserServiceImpl).scoped(),
    });
    return container;
  }
  ```

  ### SOLID Principles Application

  - **S**ingle Responsibility — Each service/engine has one clear purpose
  - **O**pen/Closed — Extend via interfaces, not modification; new features via new services
  - **L**iskov Substitution — All implementations are interchangeable via interfaces
  - **I**nterface Segregation — Small, focused interfaces (not one large interface)
  - **D**ependency Inversion — Depend on abstractions (interfaces), not concretions (classes)

