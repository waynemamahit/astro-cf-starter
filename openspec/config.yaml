  ## Project Conventions

  ### Code Style

  #### TypeScript Standards

  - **Strict mode enabled** — `tsconfig.json` extends `astro/tsconfigs/strict`
  - **No `any` type** — Use proper types, `unknown`, generics, or type narrowing
  - **Explicit return types** — All exported functions must have explicit return types
  - **Interface-first design** — Define interfaces before implementations (DI contracts live in `shared/types/`)
  - **Proper type organization** — Centralize types in dedicated `types/` directories
  - **Type-only imports** — Use explicit `import type { ... }` for type-only imports
  - **Per-framework JSX** — The global JSX runtime is SolidJS (`jsxImportSource: "solid-js"`).
    React island files MUST opt in with the pragma `/** @jsxImportSource react */`
    at the top (as in `src/components/react/Counter.tsx`). SolidJS files need no pragma.
  - **Type checking** — `pnpm typecheck` runs `wrangler types && tsc -b`; use `astro check` for `.astro` files

  ```typescript
  // ✅ CORRECT: React island opts into the React JSX runtime, types are explicit + interface-based
  /** @jsxImportSource react */
  import { useState } from "react";
  import type { User, CreateUserInput } from "../../types/user.types";

  interface UserService {
    findById(id: string): Promise<User | null>;
    create(data: CreateUserInput): Promise<User>;
  }

  // ❌ WRONG: any type, implicit returns, no type imports
  function getUser(id: any) {
    return db.query(id);
  }
  ```

  #### Type Organization

  ```
  src/types/           # Frontend-specific types
  src/server/types/    # Backend-specific types
  shared/types/        # Shared types + DI interface contracts (frontend + backend)
  ```

  - **Interfaces** — For object shapes, service contracts, and DI bindings
  - **Types** — For unions, intersections, mapped types, and aliases
  - **Enums** — Prefer `as const` objects or string literal unions over `enum`
  - **Classes** — Only when behavior encapsulation is needed (e.g., Durable Objects, DI services)

  ```typescript
  // ✅ PREFERRED: const object over enum (tree-shakeable, no runtime enum overhead)
  export const UserStatus = {
    Active: "active",
    Inactive: "inactive",
    Suspended: "suspended",
  } as const;
  export type UserStatus = (typeof UserStatus)[keyof typeof UserStatus];

  // ⚠️ ACCEPTABLE: string literal union when only the type is needed
  export type UserRole = "admin" | "user";
  ```

  #### Naming Conventions

  | Element              | Convention                   | Example                       |
  | -------------------- | ---------------------------- | ----------------------------- |
  | **Framework comps**  | `PascalCase.{tsx,vue}`       | `Counter.tsx`, `Counter.vue`  |
  | **Astro components** | `PascalCase.astro`           | `Welcome.astro`               |
  | **Astro pages**      | `kebab-case.astro` (lower)   | `index.astro`, `sign-in.astro`|
  | **Modules (ts)**     | `kebab-case.ts`              | `user.service.ts`             |
  | **Functions**        | `camelCase`                  | `getUserById`                 |
  | **Variables**        | `camelCase`                  | `userName`                    |
  | **Constants**        | `SCREAMING_SNAKE_CASE`       | `MAX_RETRY_COUNT`             |
  | **Interfaces**       | `PascalCase` (no `I` prefix) | `UserService`                 |
  | **Types**            | `PascalCase`                 | `UserRole`                    |
  | **Enums/Const obj**  | `PascalCase`                 | `UserStatus.Active`           |
  | **DO Classes**       | `PascalCase`                 | `Counter`                     |

  #### Import Order (organized automatically by Biome.js)

  1. Node.js built-ins (`node:*`)
  2. External packages (`astro`, `react`, `vue`, `solid-js`, `hono`, `zod`, etc.)
  3. Astro/Cloudflare virtual modules (`astro:*`, `cloudflare:workers`)
  4. Relative imports (`./`, `../`)
  5. Type-only imports (`import type { ... }`)

  > Biome's `assist.actions.source.organizeImports` performs the sorting; do not
  > hand-maintain import order.

  ### Formatting Rules (Biome.js)

  Configured in `biome.json` (matches the repo):

  - **Indent**: **Tabs** (`formatter.indentStyle: "tab"`)
  - **Quotes**: Double quotes for strings (`javascript.formatter.quoteStyle: "double"`)
  - **Import organization**: Automatic via `assist.actions.source.organizeImports: "on"` (assist enabled)
  - **Linter**: `rules.preset: "recommended"`; framework domains scoped per folder via `overrides`
  - **CSS**: TailwindCSS directives parsing enabled (`css.parser.tailwindDirectives: true`)
  - **HTML/Astro**: HTML formatter + full support enabled (`html.formatter.enabled: true`, `html.experimentalFullSupportEnabled: true`)
  - **Embedded snippets**: `javascript.experimentalEmbeddedSnippetsEnabled: true` (lints code in template strings)
  - **VCS**: respects `.gitignore` (`vcs.useIgnoreFile: true`, `clientKind: "git"`)

  ```jsonc
  // biome.json — framework lint domains are enabled per-folder so each island
  // (react/vue/solid) gets the right rules without cross-contamination.
  {
    "$schema": "https://biomejs.dev/schemas/2.5.11/schema.json",
    "vcs": { "enabled": true, "clientKind": "git", "useIgnoreFile": true },
    "files": { "ignoreUnknown": false },
    "html": { "formatter": { "enabled": true }, "experimentalFullSupportEnabled": true },
    "formatter": { "enabled": true, "indentStyle": "tab" },
    "linter": {
      "enabled": true,
      "domains": { "react": "none", "solid": "none", "vue": "none" },
      "rules": { "preset": "recommended" }
    },
    "javascript": {
      "experimentalEmbeddedSnippetsEnabled": true,
      "formatter": { "quoteStyle": "double" }
    },
    "assist": { "enabled": true, "actions": { "source": { "organizeImports": "on" } } },
    "css": { "parser": { "tailwindDirectives": true } },
    "overrides": [
      { "includes": ["**/react/**"], "linter": { "domains": { "react": "recommended" } } },
      { "includes": ["**/solid/**"], "linter": { "domains": { "solid": "recommended" } } },
      { "includes": ["**/vue/**", "**/*.vue"], "linter": { "domains": { "vue": "recommended" } } }
    ]
  }
  ```

