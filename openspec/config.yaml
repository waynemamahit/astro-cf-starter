  ## Database Patterns (Drizzle ORM)

  ### Separate Schemas

  - **D1 (SQLite)**: `db/d1/schema/` — edge-native, low-latency reads (binding `D1`, `drizzle-orm/d1`)
  - **Hyperdrive (PostgreSQL)**: `db/hyperdrive/schema/` — connection-pooled external DB (binding `HYPERDRIVE`, `postgres` driver)

  Each database has its own Drizzle Kit config (`drizzle.config.d1.ts`, `drizzle.config.hyperdrive.ts`),
  schema directory, and migration directory. **Never mix D1 and Hyperdrive schemas.**

  ```typescript
  // D1 — bind the Drizzle client to the request's D1 binding
  import { drizzle } from "drizzle-orm/d1";
  import * as schema from "../../db/d1/schema";
  const d1 = drizzle(env.D1, { schema });

  // Hyperdrive — connect through the pooled connection string
  import { drizzle } from "drizzle-orm/postgres-js";
  import postgres from "postgres";
  import * as schema from "../../db/hyperdrive/schema";
  const sql = postgres(env.HYPERDRIVE.connectionString, { max: 5, fetch_types: false });
  const pg = drizzle(sql, { schema });
  ```

  ### Migration Strategy

  - **D1**: `db/d1/migrations/` — SQLite-compatible SQL
  - **Hyperdrive**: `db/hyperdrive/migrations/` — PostgreSQL-compatible SQL
  - **Always generate** before applying — review migration SQL before running

  > **⚠️ Scripts to wire up:** `package.json` currently exposes `dev/build/preview/lint/typecheck/test/test:e2e`.
  > Add the Drizzle scripts below (each maps to `drizzle-kit ... --config drizzle.config.<db>.ts`,
  > with D1 migrations applied via `wrangler d1 migrations apply`).

  ```bash
  # D1 commands (recommended package.json scripts)
  pnpm d1:generate      # drizzle-kit generate (D1 config) — create migration from schema
  pnpm d1:migrate       # wrangler d1 migrations apply <db> --local
  pnpm d1:migrate:prod  # wrangler d1 migrations apply <db> --remote
  pnpm d1:studio        # drizzle-kit studio (D1 config)

  # Hyperdrive commands (recommended package.json scripts)
  pnpm db:generate      # drizzle-kit generate (Hyperdrive config)
  pnpm db:migrate       # drizzle-kit migrate (local Docker PostgreSQL)
  pnpm db:migrate:prod  # drizzle-kit migrate (production)
  pnpm db:studio        # drizzle-kit studio (Hyperdrive config)
  ```

  ### Best Practices

  - **Use indexes** — Define indexes for frequently queried columns
  - **Avoid N+1** — Use joins or Drizzle's relational query API; batch D1 writes with `db.batch([...])`
  - **Type-safe queries** — Never use raw SQL strings; use Drizzle's query builder
  - **Hyperdrive connections** — Create the `postgres()` client per request and let Hyperdrive pool; do not cache clients across requests
  - **Migration review** — Always review generated SQL before applying

  ### Local Development with Docker

  ```yaml
  # docker-compose.yml — PostgreSQL for Hyperdrive local development
  services:
    postgres:
      image: postgres:latest
      container_name: astro-cf-starter-postgres
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: staging_db
      ports:
        - "5432:5432"
      volumes:
        - postgres-data:/var/lib/postgresql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres -d staging_db"]
        interval: 10s
        timeout: 5s
        retries: 5
      restart: unless-stopped

  volumes:
    postgres-data:
      driver: local
  ```

  **Hyperdrive local connection** (configured in `wrangler.jsonc`, present in the repo):

  ```jsonc
  "hyperdrive": [{
    "binding": "HYPERDRIVE",
    "id": "${HYPERDRIVE_DB_ID}",
    "localConnectionString": "postgres://postgres:postgres@127.0.0.1:5432/staging_db"
  }]
  ```

