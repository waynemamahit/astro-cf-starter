  ## Security Patterns

  Middleware lives in `src/app.ts` and runs in order: `logger` → `secureHeaders`
  → `csrf` → `rateLimiter` → `cors` (`/api/*`) → routes → Astro `handle()`.

  ### CSRF Protection

  - **Required for all mutations**: POST, PUT, PATCH, DELETE
  - Implemented via Hono's built-in `csrf()` middleware in `src/app.ts`
  - Origin-based validation — checks request `Origin` against allowed origins
  - Applied globally before route handlers

  > **⚠️ Repo state:** `src/app.ts` currently calls `csrf()` with defaults (same-origin only).
  > Configure it with the allowed origins from `wrangler.jsonc` so cross-origin clients
  > (and integration tests) are validated explicitly.

  ```typescript
  // src/app.ts — CSRF configured from env origins
  import { csrf } from "hono/csrf";

  app.use(csrf({
    origin: (origin, c) => {
      const allowed = c.env.CORS_ALLOWED_ORIGINS?.split(",") ?? [];
      return allowed.includes(origin);
    },
  }));
  ```

  **Verification in tests:**

  - Integration tests MUST verify CSRF rejects mutations without a valid `Origin`
  - Test both allowed and disallowed origins

  ### CORS Protection

  - **Configurable origins** via `CORS_ALLOWED_ORIGINS` in `wrangler.jsonc` `vars`
  - Applied to `/api/*` routes only (not Astro SSR pages)
  - Supports a comma-separated origin list for multiple domains

  > **⚠️ Repo state:** in `wrangler.jsonc` the var is present only as a commented wildcard
  > (`// "CORS_ALLOWED_ORIGINS": "*"`) and `src/app.ts` uses `cors()` with defaults. Uncomment the
  > var with an **explicit** comma-separated origin list (never `"*"` together with `credentials: true`)
  > and read it in both `cors()` and `csrf()` — without it `c.env.CORS_ALLOWED_ORIGINS` is `undefined`
  > and all origin checks fail open/closed unexpectedly.

  ```jsonc
  // wrangler.jsonc — CORS origins configuration
  {
    "vars": {
      "CORS_ALLOWED_ORIGINS": "http://localhost:4321,https://your-domain.com"
    }
  }
  ```

  ```typescript
  // src/app.ts — CORS on API routes
  import { cors } from "hono/cors";

  app.use("/api/*", cors({
    origin: (origin, c) => {
      const allowed = c.env.CORS_ALLOWED_ORIGINS?.split(",") ?? [];
      return allowed.includes(origin) ? origin : "";
    },
    credentials: true,
    allowMethods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"],
    allowHeaders: ["Content-Type", "Authorization", "X-Correlation-Id"],
  }));
  ```

  ### Rate Limiting

  - Configured via Cloudflare `RateLimit` bindings in `wrangler.jsonc` (`ratelimits`)
  - Two tiers in the repo: `LONG_RATE_LIMITER` (1000 req/60s) and `SHORT_RATE_LIMITER` (20 req/10s)
  - Applied via `hono-rate-limiter` with a `cf-connecting-ip` key generator (already wired for `LONG_RATE_LIMITER`)

  ### Secure Headers

  - Applied globally via `hono/secure-headers` middleware (already wired in `src/app.ts`)
  - Includes CSP, X-Frame-Options, X-Content-Type-Options, etc.

  ### Sensitive Data Handling

  - **Never log sensitive data** — Logger service sanitizes automatically
  - **Environment variables** for secrets — use `.dev.vars` locally, Wrangler secrets in production
  - **No hardcoded credentials** in codebase (`scripts/gen-wrangler.js` resolves `${...}` placeholders from `.dev.vars`)
  - **Wrangler types** auto-generated — run `wrangler types` (via `pnpm typecheck`) to update `worker-configuration.d.ts`

