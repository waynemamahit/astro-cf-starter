  ## UI/UX Patterns

  ### Semantic HTML, Accessibility & SEO

  - **Semantic elements**: `<main>`, `<nav>`, `<article>`, `<section>`, `<header>`, `<footer>`, `<aside>`
  - **ARIA roles**: Proper roles for interactive elements, live regions for dynamic content
  - **Keyboard navigation**: All interactions keyboard-accessible (Tab, Enter, Escape, Arrow keys)
  - **Focus management**: Visible focus indicators, focus trapping in modals
  - **Screen reader support**: Descriptive labels, `aria-label`, `aria-describedby`, `aria-live`
  - **Skip links**: "Skip to main content" link as first focusable element
  - **Color contrast**: Minimum WCAG 2.1 AA contrast ratios via DaisyUI theme tokens
  - **Landmark regions**: Proper landmark structure for assistive technology
  - **SEO**: Astro renders semantic HTML server-first (great for crawlers). Set `<title>`,
    `<meta name="description">`, canonical/OpenGraph tags, `lang` attribute, and `hreflang`
    links per locale in the layout `<head>`; use a single `<h1>` per page with logical heading order

  ```tsx
  // ✅ CORRECT: Semantic HTML with ARIA
  <a href="#main-content" className="sr-only focus:not-sr-only">
    Skip to main content
  </a>
  <header role="banner">
    <nav aria-label="Primary navigation">
      {/* Navigation items */}
    </nav>
  </header>
  <main id="main-content" role="main" aria-label="Main content">
    <section aria-labelledby="section-heading">
      <h2 id="section-heading">Section Title</h2>
      {/* Content */}
    </section>
  </main>
  <footer role="contentinfo">
    {/* Footer content */}
  </footer>
  ```

  ### Form Layouts

  - Follow [TailwindCSS Form Layouts](https://tailwindcss.com/plus/ui-blocks/application-ui/forms/form-layouts)
  - **Mobile-first responsive**: Stack on mobile, grid on desktop
  - **Proper label associations**: `<label htmlFor="...">` on every input
  - **Error state handling**: Clear inline error messages with `aria-invalid` and `aria-describedby`
  - **Loading states**: Visual feedback with disabled state and spinner
  - **Validation**: Client-side Zod validation in islands + server-side Zod validation in the Hono route
  - **CSRF token**: send the `Origin` header (validated by `csrf()`); for native `.astro` POST forms include a hidden token field if needed
  - **Native vs island forms**: simple `.astro` `<form method="post">` posts to a Hono route; interactive forms are framework islands that `fetch("/api/v1/...")`

  ```tsx
  // Responsive form layout with TailwindCSS + DaisyUI (React island shown; same classes in Vue/Solid)
  <form className="space-y-8 divide-y divide-base-300" method="post">
    <div className="md:grid md:grid-cols-3 md:gap-6">
      <div className="md:col-span-1">
        <h3 className="text-lg font-medium text-base-content">Profile</h3>
        <p className="mt-1 text-sm text-base-content/60">
          This information will be displayed publicly.
        </p>
      </div>
      <div className="mt-5 md:col-span-2 md:mt-0 space-y-4">
        <div className="form-control w-full">
          <label className="label" htmlFor="name">
            <span className="label-text">Full Name</span>
          </label>
          <input
            id="name"
            name="name"
            type="text"
            className="input input-bordered w-full"
            aria-invalid={!!errors?.name}
            aria-describedby={errors?.name ? "name-error" : undefined}
          />
          {errors?.name && (
            <p id="name-error" className="text-error text-sm mt-1" role="alert">
              {errors.name}
            </p>
          )}
        </div>
      </div>
    </div>
  </form>
  ```

  ### Custom Components (DaisyUI-based)

  Define custom components based on requirements and use cases:

  | Component       | Base            | Features                                             |
  | --------------- | --------------- | ---------------------------------------------------- |
  | **Toast**       | DaisyUI toast   | Auto-dismiss, stacking, severity levels, accessible  |
  | **Modal**       | DaisyUI modal   | Focus trap, Escape to close, ARIA dialog role        |
  | **Carousel**    | DaisyUI carousel| Keyboard nav, swipe, auto-play with pause            |
  | **Dropdown**    | DaisyUI dropdown| Keyboard nav, ARIA listbox/menu, click outside close |
  | **DataTable**   | Custom          | Sortable, filterable, paginated, responsive          |
  | **ConfirmDialog** | DaisyUI modal | Confirm/cancel actions with focus management         |

  Custom components may be authored in any island framework (React/Vue/Solid) based on the use case.
  All custom components must:
  - Have unit tests (Testing Library for the chosen framework)
  - Support keyboard navigation
  - Include proper ARIA attributes
  - Be responsive (mobile-first TailwindCSS)

  ### DaisyUI Theming

  - **Default theme**: `light` (via `--default` flag)
  - **Dark mode**: `dark` (via `--prefersdark` for OS preference)
  - **Theme switching**: `data-theme` attribute on `<html>` element
  - **Persistence**: localStorage for user preference
  - **Configuration** in `src/styles/global.css`:

  > **⚠️ Repo state:** `src/styles/global.css` currently declares `@plugin "daisyui";` with no theme
  > list (DaisyUI's built-in default). Set `light --default` explicitly and enable the themes
  > exposed by the theme selector.

  ```css
  /* src/styles/global.css — TailwindCSS 4 + DaisyUI */
  @import "tailwindcss";
  @plugin "daisyui" {
    themes: light --default, dark --prefersdark, cupcake, corporate, dracula;
  }
  ```

  **Theme Flags:**

  - `--default` — Sets the default theme on first visit
  - `--prefersdark` — Auto-applies when `prefers-color-scheme: dark` is set

  **Apply theme:**

  ```html
  <html data-theme="light">
    <!-- Full page uses light theme -->
    <div data-theme="dark">
      <!-- Nested section uses dark theme -->
    </div>
  </html>
  ```

