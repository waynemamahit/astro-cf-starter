  ### Environment Variables

  ```bash
  # .dev.vars (local dev — NOT committed; resolved into wrangler.json by scripts/gen-wrangler.js)
  VALUE_FROM_CLOUDFLARE=your_value_here
  KV_ID=your_kv_id_here
  D1_DB_ID=your_d1_db_id_here
  HYPERDRIVE_DB_ID=your_hyperdrive_db_id_here
  VECTORIZE_INDEX_NAME=your_vectorize_index_name_here
  # Recommended for CORS/CSRF origin checks:
  CORS_ALLOWED_ORIGINS=http://localhost:4321
  ```

  > **⚠️ Repo state:** `CORS_ALLOWED_ORIGINS` is commented out in the `wrangler.jsonc` `vars`
  > section. Add it to enable CORS/CSRF origin checks at runtime — without it
  > `c.env.CORS_ALLOWED_ORIGINS` is `undefined` and origin checks behave unexpectedly.

  ```jsonc
  // wrangler.jsonc — vars (placeholders resolved from .dev.vars by gen-wrangler.js)
  {
    "vars": {
      "CORS_ALLOWED_ORIGINS": "http://localhost:4321,https://your-domain.com",
      "VALUE_FROM_CLOUDFLARE": "${VALUE_FROM_CLOUDFLARE}"
    }
  }
  ```

