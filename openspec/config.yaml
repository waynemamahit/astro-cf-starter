context: |
  # Project Context

  ## Purpose

  A production-ready full-stack starter template built on **Astro (Islands Architecture)** with **Cloudflare Workers**. The frontend renders interactive islands in **React, Vue, and SolidJS** on top of Astro's server-first model, while the backend is a **Hono** API mounted inside the same Worker (`src/app.ts`) that delegates SSR to Astro via `@astrojs/cloudflare`. The project provides a scalable, type-safe foundation with comprehensive Cloudflare service integrations, clean architecture following SOLID principles, and specification-driven development with OpenSpec.

  **Goals:**

  - Provide a robust, type-safe development experience with zero tolerance for `any` types
  - Ship minimal client JavaScript via Astro islands — hydrate React/Vue/SolidJS components only when needed (`client:*` directives)
  - Enable rapid feature development with clean architecture patterns (Engine/Facade + Service layers)
  - Ensure high code quality through comprehensive testing (90%+ coverage across unit, integration, and E2E)
  - Support internationalization (Astro i18n + i18next) and accessibility (ARIA, semantic HTML, SEO) out of the box
  - Leverage Cloudflare's edge computing capabilities (D1, Hyperdrive, KV, R2, Durable Objects, Vectorize, Workers AI, Browser Rendering)
  - Implement security best practices (CSRF, CORS, rate limiting, secure headers, sensitive data sanitization)

