  ## Internationalization (i18n)

  ### Centralized References

  - **Frontend routing**: Astro's built-in i18n (`i18n` config in `astro.config.mjs`) drives locale-aware URLs and the `astro:i18n` helpers (`getRelativeLocaleUrl`, `getLocaleByPath`)
  - **Frontend messages**: a shared `i18next` instance in `src/i18n/config.ts` provides translation catalogs to `.astro` pages and to React/Vue/Solid islands
  - **Backend**: `i18next` with Hono in `src/server/i18n/` — detects locale from `Accept-Language`/query and translates API messages
  - **Shared keys** — keep translation keys consistent across frontend and backend (mirror `common`/`errors`/`validation` namespaces)

  ```javascript
  // astro.config.mjs — Astro built-in i18n routing (requires output: "server")
  export default defineConfig({
    i18n: {
      locales: ["en", "id"],
      defaultLocale: "en",
      routing: { prefixDefaultLocale: false },
    },
  });
  ```

  ### Translation Structure

  ```
  src/i18n/
  ├── config.ts           # i18next instance (namespaces, fallbackLng) + Astro locale helpers
  └── locales/
      ├── en/
      │   ├── common.json      # Shared UI labels, buttons, navigation
      │   ├── errors.json      # Error messages
      │   └── validation.json  # Form validation messages
      └── id/
          ├── common.json
          ├── errors.json
          └── validation.json

  src/server/i18n/
  ├── config.ts           # Backend i18next instance (server namespaces)
  └── locales/
      ├── en.json          # API error messages, notifications
      └── id.json
  ```

  ### Theme & Language Selector

  - Built into the **main layout** (`src/layouts/Layout.astro`), visible on all pages
  - Implemented as a single interactive **island** (any framework) — keep it framework-consistent
  - **Theme selector**: DaisyUI theme switch via the `data-theme` attribute on `<html>`
  - **Language selector**: switches locale; use `getRelativeLocaleUrl()` for SSR-correct links and `i18next.changeLanguage()` for client islands
  - **Icons**: Lucide per framework (`lucide-react`, `@lucide/vue`, `lucide-solid`)
  - **Persistence**: `localStorage` for theme; `localStorage` + cookie for language (so SSR can read it)
  - **Accessible**: keyboard-navigable dropdowns with ARIA attributes
  - **Default theme**: `light` (DaisyUI `--default` flag — see UI/UX § DaisyUI Theming)

  > **⚠️ Repo state:** `src/layouts/Layout.astro` is currently a minimal shell (`<html lang="en">`,
  > a `<slot />`, no landmarks, title "Astro Basics") and imports only `global.css`. Build it out
  > with semantic landmarks (`<header>`/`<main>`/`<footer>`), a skip link, SEO `<head>` tags
  > (title/description/canonical/OpenGraph + `hreflang` per locale), and mount the theme + language
  > selector islands as described above.

  ```astro
  ---
  // src/layouts/Layout.astro — selectors hydrated as islands in the layout
  import ThemeSelector from "../components/react/ThemeSelector";
  import LanguageSelector from "../components/react/LanguageSelector";
  ---
  <header role="banner">
    <nav aria-label="Primary navigation">
      <LanguageSelector client:idle />
      <ThemeSelector client:idle />
    </nav>
  </header>
  ```

