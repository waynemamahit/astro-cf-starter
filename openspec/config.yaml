  ## Islands & Framework Selection

  Astro renders everything server-first and ships **zero client JS by default**. Interactivity is
  added only through **islands** (React, Vue, or SolidJS) hydrated with a `client:*` directive.
  All three frameworks are available; pick **one framework per island/feature** and keep islands thin.

  ### Selection Rule (performance first, compatibility fallback)

  **Priority 1 — Performance:** Default to the framework with the smallest runtime / least hydration
  cost for the interaction. **SolidJS** is the default for performance-sensitive islands (fine-grained
  signals, no virtual DOM, tiny runtime). **Vue** is the next choice for ergonomic, moderately
  interactive UI (SFCs, reactivity, small footprint).

  **Priority 2 — Compatibility:** If the required capability or third-party library is missing/weaker
  in the higher-performance framework, choose the framework with the **best compatibility for that
  requirement**. **React** has the largest ecosystem — use it when a feature depends on a
  React-only library, richer tooling, or broader community support that Solid/Vue cannot satisfy.

  | Need                                              | Preferred framework | Why                                              |
  | ------------------------------------------------- | ------------------- | ------------------------------------------------ |
  | Max performance, fine-grained reactivity          | **SolidJS**         | Smallest runtime, no VDOM, signal-based updates  |
  | Ergonomic interactive UI, forms, moderate state   | **Vue**             | SFCs, reactivity, small bundle                   |
  | Library/ecosystem compatibility is the constraint | **React**           | Largest ecosystem; widest third-party support    |

  > **Decision flow:** start with SolidJS for performance → if DX/feature fit is better, use Vue →
  > if a required library/integration only works (or works best) in React, use React. Document the
  > chosen framework + the reason (performance vs compatibility) in the change `design.md`.

  ### Island Scoping & Hydration

  - **Folder scoping** (matches `astro.config.mjs` integration `include` globs):
    React `**/react/*`, SolidJS `**/solid/*`, Vue `**/vue/*`
  - **Hydration directives** — choose the lightest that satisfies UX:
    - `client:idle` — non-critical UI (theme/language selectors, menus)
    - `client:visible` — below-the-fold widgets (lazy-hydrate on scroll)
    - `client:load` — immediately-interactive, above-the-fold islands
    - `client:only="react|vue|solid"` — client-only islands (no SSR)
  - **Keep islands thin** — islands call frontend engines/services from event handlers; no business
    logic inside the component. Minimize props passed across the island boundary (must be serializable).

